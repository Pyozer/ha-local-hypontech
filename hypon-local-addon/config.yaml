name: Hypon Local Bridge
version: "0.1.0"
slug: hypon_local
description: >-
  Read your Hypon micro-inverter (COM-WF collector, HMS-800W and variants)
  locally and publish it to Home Assistant via MQTT Discovery - no DNS change,
  no router change - while still relaying to the Hypon cloud so the vendor app
  keeps working.
url: "https://github.com/Pyozer/ha-local-hypontech"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
# Required: raw socket (ARP) + network manipulation (iptables, ip_forward)
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
# Home Assistant provides the MQTT broker credentials automatically
services:
  - mqtt:need
options:
  inverter_ip: ""
  gateway_ip: ""
  interface: ""
  relay_to_cloud: true
  cloud_host: "gateway-be8b19e7047b780f.elb.eu-central-1.amazonaws.com"
  cloud_port: 1883
  listen_port: 18883
  base_topic: "hypon"
  discovery_prefix: "homeassistant"
  publish_raw: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  debug: false
schema:
  inverter_ip: "str"
  gateway_ip: "str?"
  interface: "str?"
  relay_to_cloud: "bool"
  cloud_host: "str"
  cloud_port: "port"
  listen_port: "port"
  base_topic: "str"
  discovery_prefix: "str"
  publish_raw: "bool"
  mqtt_host: "str?"
  mqtt_port: "port"
  mqtt_user: "str?"
  mqtt_password: "password?"
  debug: "bool"
